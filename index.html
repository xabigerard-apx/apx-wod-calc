<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APX WOD Time Calculator</title>

  <!-- PWA & Métadonnées Android Plein écran -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#613795">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    /* Reset & variables CSS APX */
    :root {
      --apx-purple: #613795;
      --apx-hover: #7342b0;
      --apx-active: #502c7b;
      --apx-light: #9460d9;
      --bg-dark: #0f0f14;
      --surface-card: #181822;
      --surface-btn: #22222f;
      --surface-btn-hover: #2b2b3b;
      --border-color: #2e2e3e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* SUPPRESSION RADICALE DE TOUTES LES BANDES DÉFILANTES (SCROLLBARS) */
    *::-webkit-scrollbar,
    .no-scrollbar::-webkit-scrollbar,
    .display-screen::-webkit-scrollbar,
    #primary-display::-webkit-scrollbar,
    #expression-display::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }

    * {
      scrollbar-width: none !important; /* Firefox */
      -ms-overflow-style: none !important; /* IE/Edge */
    }

    /* Conteneur Mobile centré */
    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 14px 16px;
      position: relative;
    }

    /* En-tête */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--apx-light), var(--apx-purple));
      color: #ffffff;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 0.5px;
      padding: 6px 9px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(97, 55, 149, 0.4);
    }

    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #eaeaf2;
      text-transform: uppercase;
    }

    .header-btn {
      background: var(--surface-btn);
      border: 1px solid var(--border-color);
      color: #c4c4d4;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .header-btn:active {
      transform: scale(0.93);
      background: var(--surface-btn-hover);
    }

    .history-indicator {
      display: none;
      position: absolute;
      top: -2px;
      right: -2px;
      width: 9px;
      height: 9px;
      background: var(--apx-light);
      border-radius: 50%;
      border: 2px solid var(--bg-dark);
    }

    /* GRAND ÉCRAN D'AFFICHAGE REHAUSSÉ */
    .display-screen {
      background: linear-gradient(180deg, #181824 0%, #13131c 100%);
      border: 1px solid #2b2b3d;
      border-radius: 24px;
      padding: 22px 20px 18px;
      margin: 12px 0 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 195px; /* Plus haut, plus spacieux */
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }

    /* Subtil glow APX dans le coin */
    .display-screen::before {
      content: "";
      position: absolute;
      top: -30px;
      right: -30px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(97, 55, 149, 0.22) 0%, transparent 70%);
      pointer-events: none;
    }

    .expression-row {
      font-family: "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
      font-size: 15px;
      color: #8c8ca5;
      text-align: right;
      letter-spacing: 0.5px;
      min-height: 22px;
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 6px;
    }

    .primary-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
    }

    .mode-pill {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 5px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      background: rgba(97, 55, 149, 0.22);
      color: var(--apx-light);
      border: 1px solid rgba(148, 96, 217, 0.35);
      flex-shrink: 0;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .mode-pill.rounds {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }

    /* CHIFFRES XXL GÉANTS SANS BANDE DÉFILANTE */
    .giant-digits {
      font-family: "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
      font-size: clamp(52px, 14vw, 72px); /* Très gros, responsive */
      font-weight: 900;
      line-height: 1.02;
      color: #ffffff;
      text-align: right;
      letter-spacing: -1.5px;
      overflow-x: auto;
      white-space: nowrap;
      width: 100%;
    }

    /* GRILLE CLAVIER TACTILE 4x5 */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      width: 100%;
    }

    .btn-calc {
      height: 64px;
      border-radius: 16px;
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.08s ease;
      position: relative;
    }

    .btn-calc:active {
      transform: scale(0.93);
      filter: brightness(1.22);
    }

    /* Touches Chiffres normales */
    .btn-num {
      background: var(--surface-btn);
      border: 1px solid var(--border-color);
      color: #ffffff;
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }

    /* Bouton zéro élargi */
    .btn-zero {
      grid-column: span 2;
    }

    /* Actions spéciales ligne 1 */
    .btn-ac {
      background: rgba(127, 29, 29, 0.35);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 17px;
      font-weight: 800;
    }

    .btn-del {
      background: rgba(124, 45, 18, 0.35);
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: #fdba74;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      gap: 4px;
    }

    .btn-paren {
      background: var(--surface-btn);
      border: 1px solid var(--border-color);
      color: #e2e2ec;
      font-size: 20px;
      font-weight: 800;
    }

    .btn-mode-toggle {
      background: #1c1c28;
      border: 1px solid #323245;
      color: #d8d8ea;
      font-size: 12px;
      font-weight: 800;
      flex-direction: column;
      gap: 2px;
      line-height: 1.1;
    }

    .btn-mode-toggle span:last-child {
      font-size: 10px;
      color: var(--apx-light);
    }

    /* COLONNE DE DROITE : LES 5 BOUTONS MAUVES APX (#613795) */
    .btn-apx {
      background: linear-gradient(145deg, #6c3da6, var(--apx-purple));
      color: #ffffff;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 4px 14px rgba(97, 55, 149, 0.35);
      border: 1px solid rgba(148, 96, 217, 0.4);
    }

    .btn-equals {
      font-size: 32px;
      background: linear-gradient(135deg, #7c44be, var(--apx-purple));
      box-shadow: 0 6px 20px rgba(97, 55, 149, 0.55);
    }

    /* TIROIR MODAL HISTORIQUE */
    .history-drawer {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 20, 0.96);
      backdrop-filter: blur(10px);
      z-index: 50;
      display: none;
      flex-direction: column;
      padding: 16px;
      border-radius: 20px;
    }

    .history-drawer.open {
      display: flex;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .history-header h3 {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--apx-light);
      text-transform: uppercase;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-card {
      background: #191924;
      border: 1px solid #2d2d3e;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.12s;
    }

    .history-card:active {
      background: #232332;
      border-color: var(--apx-light);
    }

    .history-card-top {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #8c8ca5;
      font-family: monospace;
    }

    .history-card-res {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      font-family: monospace;
      text-align: right;
    }

    .history-empty {
      text-align: center;
      color: #71718a;
      font-size: 13px;
      margin-top: 50px;
    }

    .history-footer {
      display: flex;
      gap: 10px;
    }

    .footer-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .btn-clear-hist {
      background: rgba(127, 29, 29, 0.4);
      color: #fca5a5;
    }

    .btn-close-hist {
      background: #2b2b3a;
      color: #e2e2ec;
    }

    /* Toast */
    .toast-box {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #252535;
      border: 1px solid var(--apx-light);
      color: #ffffff;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 60;
      white-space: nowrap;
    }

    .toast-box.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    
    <!-- En-tête APX -->
    <header class="app-header">
      <div class="brand-wrap">
        <div class="brand-badge">APX</div>
        <div class="brand-title">WOD TIME CALC</div>
      </div>
      
      <button id="btn-toggle-history" class="header-btn" title="Historique">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span id="history-indicator" class="history-indicator"></span>
      </button>
    </header>

    <!-- GRAND ÉCRAN D'AFFICHAGE REHAUSSÉ (ZÉRO BANDE DÉFILANTE) -->
    <section class="display-screen">
      <!-- Ligne d'expression précédente -->
      <div id="expression-display" class="expression-row"></div>

      <!-- Ligne principale : Badge Mode + Chiffres Géants -->
      <div class="primary-row">
        <div id="mode-badge" class="mode-pill">TEMPS ⏱</div>
        <div id="primary-display" class="giant-digits">0:00</div>
      </div>
    </section>

    <!-- CLAVIER TACTILE 4x5 -->
    <main class="keypad-grid">
      <!-- LIGNE 1 : AC | DEL ⌫ | ( ) | ÷ (Mauve) -->
      <button data-action="clear" class="btn-calc btn-ac">AC</button>
      <button data-action="delete" class="btn-calc btn-del">DEL ⌫</button>
      <button data-action="parenthesis" class="btn-calc btn-paren">( )</button>
      <button data-action="operator" data-val="÷" class="btn-calc btn-apx">÷</button>

      <!-- LIGNE 2 : 7 | 8 | 9 | × (Mauve) -->
      <button data-val="7" class="btn-calc btn-num">7</button>
      <button data-val="8" class="btn-calc btn-num">8</button>
      <button data-val="9" class="btn-calc btn-num">9</button>
      <button data-action="operator" data-val="×" class="btn-calc btn-apx">×</button>

      <!-- LIGNE 3 : 4 | 5 | 6 | − (Mauve) -->
      <button data-val="4" class="btn-calc btn-num">4</button>
      <button data-val="5" class="btn-calc btn-num">5</button>
      <button data-val="6" class="btn-calc btn-num">6</button>
      <button data-action="operator" data-val="-" class="btn-calc btn-apx">−</button>

      <!-- LIGNE 4 : 1 | 2 | 3 | + (Mauve) -->
      <button data-val="1" class="btn-calc btn-num">1</button>
      <button data-val="2" class="btn-calc btn-num">2</button>
      <button data-val="3" class="btn-calc btn-num">3</button>
      <button data-action="operator" data-val="+" class="btn-calc btn-apx">+</button>

      <!-- LIGNE 5 : Rounds # | 0 (span 2) | = (Mauve) -->
      <button data-action="toggle-mode" class="btn-calc btn-mode-toggle">
        <span>Rounds</span>
        <span id="sub-mode-text"># / ⏱</span>
      </button>
      <button data-val="0" class="btn-calc btn-num btn-zero">0</button>
      <button data-action="calculate" class="btn-calc btn-apx btn-equals">=</button>
    </main>

    <!-- TIROIR HISTORIQUE -->
    <div id="history-drawer" class="history-drawer">
      <div class="history-header">
        <h3>Historique WOD</h3>
        <button id="btn-close-history" class="header-btn" style="width:32px; height:32px;">✕</button>
      </div>
      <div id="history-list" class="history-list"></div>
      <div class="history-footer">
        <button id="btn-clear-history" class="footer-btn btn-clear-hist">Vider l'historique</button>
        <button id="btn-close-history-bottom" class="footer-btn btn-close-hist">Fermer</button>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast-box">Résultat réinjecté</div>

  </div>

  <script>
    /**
     * Moteur de calcul WOD APX
     * Saisie Micro-ondes : "45" -> 0:45 | "130" -> 1:30 | "1245" -> 12:45
     * Mode Rounds (#) : Nombres entiers pour séries, rounds et multiplicateurs
     */

    let inputMode = 'time'; // 'time' ou 'number'
    let rawDigits = '';
    let tokens = []; // [{ type: 'time'|'number'|'op'|'paren', sec, val, display }]
    let history = [];

    // Sélecteurs
    const primaryDisplay = document.getElementById('primary-display');
    const expressionDisplay = document.getElementById('expression-display');
    const modeBadge = document.getElementById('mode-badge');
    const subModeText = document.getElementById('sub-mode-text');
    const historyDrawer = document.getElementById('history-drawer');
    const historyList = document.getElementById('history-list');
    const historyIndicator = document.getElementById('history-indicator');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // Formatage style micro-ondes
    function parseMicrowave(str) {
      if (!str || str === '') return { sec: 0, display: '0:00' };
      const clean = str.replace(/^0+/, '') || '0';
      let m = 0, s = 0;
      if (clean.length <= 2) {
        s = parseInt(clean, 10);
      } else {
        s = parseInt(clean.slice(-2), 10);
        m = parseInt(clean.slice(0, -2), 10);
      }
      const totalSec = (m * 60) + s;
      const display = `${m}:${s < 10 ? '0' + s : s}`;
      return { sec: totalSec, display };
    }

    function formatSecondsToMMSS(totalSec) {
      const isNeg = totalSec < 0;
      const abs = Math.abs(Math.round(totalSec));
      const m = Math.floor(abs / 60);
      const s = abs % 60;
      return `${isNeg ? '-' : ''}${m}:${s < 10 ? '0' + s : s}`;
    }

    function updateDisplay() {
      // 1. Écran Principal
      if (inputMode === 'time') {
        modeBadge.textContent = 'TEMPS ⏱';
        modeBadge.className = 'mode-pill';
        subModeText.textContent = 'Mode #';
        if (rawDigits === '') {
          primaryDisplay.textContent = '0:00';
          primaryDisplay.style.color = '#8e8ea6';
        } else {
          primaryDisplay.textContent = parseMicrowave(rawDigits).display;
          primaryDisplay.style.color = '#ffffff';
        }
      } else {
        modeBadge.textContent = 'ROUNDS #';
        modeBadge.className = 'mode-pill rounds';
        subModeText.textContent = 'Mode ⏱';
        if (rawDigits === '') {
          primaryDisplay.textContent = '0';
          primaryDisplay.style.color = '#8e8ea6';
        } else {
          primaryDisplay.textContent = rawDigits;
          primaryDisplay.style.color = '#ffffff';
        }
      }

      // 2. Écran Expression
      if (tokens.length === 0) {
        expressionDisplay.innerHTML = '&nbsp;';
      } else {
        let text = '';
        tokens.forEach(t => {
          if (t.type === 'op') text += ` ${t.val} `;
          else if (t.type === 'paren') text += t.val;
          else text += t.display;
        });
        expressionDisplay.textContent = text;
      }
    }

    function commitInput() {
      if (rawDigits === '') return false;

      if (inputMode === 'time') {
        const parsed = parseMicrowave(rawDigits);
        tokens.push({
          type: 'time',
          sec: parsed.sec,
          display: parsed.display
        });
      } else {
        const n = parseFloat(rawDigits) || 0;
        tokens.push({
          type: 'number',
          val: n,
          display: `${n}`
        });
      }
      rawDigits = '';
      return true;
    }

    function handleDigit(d) {
      if (rawDigits.length >= 6) return;
      if (inputMode === 'number' && rawDigits === '0') {
        rawDigits = d;
      } else {
        rawDigits += d;
      }
      updateDisplay();
    }

    function handleDelete() {
      if (rawDigits.length > 0) {
        rawDigits = rawDigits.slice(0, -1);
      } else if (tokens.length > 0) {
        const popped = tokens.pop();
        if (popped.type === 'time') {
          const m = Math.floor(popped.sec / 60);
          const s = popped.sec % 60;
          const combined = `${m > 0 ? m : ''}${s < 10 ? '0' + s : s}`;
          rawDigits = combined.slice(0, -1);
          inputMode = 'time';
        } else if (popped.type === 'number') {
          rawDigits = `${popped.val}`.slice(0, -1);
          inputMode = 'number';
        }
      }
      updateDisplay();
    }

    function handleClear() {
      rawDigits = '';
      tokens = [];
      inputMode = 'time';
      updateDisplay();
    }

    function handleOperator(op) {
      commitInput();

      if (tokens.length === 0) {
        tokens.push({ type: 'time', sec: 0, display: '0:00' });
      }

      const last = tokens[tokens.length - 1];
      if (last.type === 'op') {
        last.val = op;
      } else {
        tokens.push({ type: 'op', val: op });
      }

      // Par ergonomie WOD : × et ÷ basculent automatiquement sur un nombre de rounds/intervalles
      if (op === '×' || op === '÷') {
        inputMode = 'number';
      } else {
        inputMode = 'time';
      }

      updateDisplay();
    }

    // Parenthèse intelligente Samsung
    function handleParenthesis() {
      commitInput();

      let openCount = 0;
      let closeCount = 0;
      tokens.forEach(t => {
        if (t.type === 'paren' && t.val === '(') openCount++;
        if (t.type === 'paren' && t.val === ')') closeCount++;
      });

      const last = tokens[tokens.length - 1];
      const hasUnclosed = openCount > closeCount;

      if (hasUnclosed && last && (last.type === 'time' || last.type === 'number' || last.val === ')')) {
        tokens.push({ type: 'paren', val: ')' });
      } else {
        if (last && (last.type === 'time' || last.type === 'number' || last.val === ')')) {
          tokens.push({ type: 'op', val: '×' });
        }
        tokens.push({ type: 'paren', val: '(' });
      }

      updateDisplay();
    }

    function toggleMode() {
      inputMode = inputMode === 'time' ? 'number' : 'time';
      updateDisplay();
    }

    // Moteur d'évaluation Mathématique WOD
    function calculate() {
      commitInput();
      if (tokens.length === 0) return;

      // Fermeture automatique des parenthèses non fermées
      let openCount = 0, closeCount = 0;
      tokens.forEach(t => {
        if (t.type === 'paren' && t.val === '(') openCount++;
        if (t.type === 'paren' && t.val === ')') closeCount++;
      });
      while (openCount > closeCount) {
        tokens.push({ type: 'paren', val: ')' });
        closeCount++;
      }

      // Expression pour l'historique
      const exprString = tokens.map(t => {
        if (t.type === 'op') return ` ${t.val} `;
        return t.display || t.val;
      }).join('');

      // Conversion en expression JS
      let jsExpr = '';
      tokens.forEach(t => {
        if (t.type === 'time') jsExpr += t.sec;
        else if (t.type === 'number') jsExpr += t.val;
        else if (t.type === 'op') {
          if (t.val === '×') jsExpr += '*';
          else if (t.val === '÷') jsExpr += '/';
          else if (t.val === '−') jsExpr += '-';
          else jsExpr += t.val;
        } else if (t.type === 'paren') {
          jsExpr += t.val;
        }
      });

      try {
        const rawRes = Function(`'use strict'; return (${jsExpr})`)();
        const roundedSec = Math.round(rawRes);
        const formattedRes = formatSecondsToMMSS(roundedSec);

        // Sauvegarde historique
        addHistoryItem(exprString, formattedRes, roundedSec);

        // Réinitialisation avec résultat
        tokens = [{
          type: 'time',
          sec: roundedSec,
          display: formattedRes
        }];
        rawDigits = '';
        inputMode = 'time';

        expressionDisplay.textContent = `${exprString} =`;
        primaryDisplay.textContent = formattedRes;
        primaryDisplay.style.color = '#ffffff';

      } catch (err) {
        primaryDisplay.textContent = 'Erreur';
        primaryDisplay.style.color = '#f87171';
        setTimeout(() => updateDisplay(), 1200);
      }
    }

    // GESTION HISTORIQUE (LocalStorage)
    const STORAGE_KEY = 'apx_wod_calc_v2';

    function loadHistory() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) history = JSON.parse(saved);
      } catch (e) {
        history = [];
      }
      renderHistory();
    }

    function addHistoryItem(expr, res, sec) {
      history.unshift({
        expr,
        res,
        sec,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      if (history.length > 35) history.pop();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      } catch (e) {}
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = '';
      if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">Aucun calcul enregistré</div>';
        historyIndicator.style.display = 'none';
        return;
      }

      historyIndicator.style.display = 'block';

      history.forEach(item => {
        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div class="history-card-top">
            <span>${item.time}</span>
            <span>${item.expr}</span>
          </div>
          <div class="history-card-res">${item.res}</div>
        `;
        card.addEventListener('click', () => {
          tokens.push({
            type: 'time',
            sec: item.sec,
            display: item.res
          });
          historyDrawer.classList.remove('open');
          updateDisplay();
          showToast('Résultat réinjecté !');
        });
        historyList.appendChild(card);
      });
    }

    // ÉCOUTEURS D'ÉVÉNEMENTS CLAVIER TACTILE
    document.querySelectorAll('.btn-calc').forEach(btn => {
      btn.addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate(12);

        const val = btn.getAttribute('data-val');
        const action = btn.getAttribute('data-action');

        if (val !== null && action !== 'operator') {
          handleDigit(val);
        } else if (action) {
          switch (action) {
            case 'operator':
              handleOperator(val);
              break;
            case 'parenthesis':
              handleParenthesis();
              break;
            case 'delete':
              handleDelete();
              break;
            case 'clear':
              handleClear();
              break;
            case 'calculate':
              calculate();
              break;
            case 'toggle-mode':
              toggleMode();
              break;
          }
        }
      });
    });

    // Gestion de l'historique
    document.getElementById('btn-toggle-history').addEventListener('click', () => {
      historyDrawer.classList.toggle('open');
    });
    document.getElementById('btn-close-history').addEventListener('click', () => {
      historyDrawer.classList.remove('open');
    });
    document.getElementById('btn-close-history-bottom').addEventListener('click', () => {
      historyDrawer.classList.remove('open');
    });
    document.getElementById('btn-clear-history').addEventListener('click', () => {
      history = [];
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
      showToast('Historique effacé');
    });

    // Support Clavier physique
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') handleDigit(e.key);
      else if (e.key === '+') handleOperator('+');
      else if (e.key === '-') handleOperator('-');
      else if (e.key === '*') handleOperator('×');
      else if (e.key === '/') handleOperator('÷');
      else if (e.key === '(' || e.key === ')') handleParenthesis();
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
      else if (e.key === 'Backspace') handleDelete();
      else if (e.key === 'Escape') handleClear();
    });

    // Initialisation
    loadHistory();
    updateDisplay();
  </script>
</body>
</html>
